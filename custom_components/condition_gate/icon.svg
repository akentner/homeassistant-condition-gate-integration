<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- Two gate posts -->
  <rect x="128" y="96"  width="32" height="320" rx="16" fill="#FFFFFF"/>
  <rect x="352" y="96"  width="32" height="320" rx="16" fill="#FFFFFF"/>
  <!-- Horizontal gate bar (slightly tilted to look "open") -->
  <g transform="rotate(-18 256 256)">
    <rect x="112" y="232" width="288" height="48" rx="24" fill="#FFFFFF"/>
  </g>
  <!-- Small condition indicator: check-mark inside a circle -->
  <circle cx="256" cy="416" r="44" fill="#FFFFFF"/>
  <path d="M232 418 l16 16 l32 -36" fill="none" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
